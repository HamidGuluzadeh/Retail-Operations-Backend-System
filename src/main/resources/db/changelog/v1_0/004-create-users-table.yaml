databaseChangeLog:
  - changeSet:
      id: 003-create-users-table-2026-11-28
      author: Hamid Guluzadeh
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: employee_id
                  type: VARCHAR(36)
                  constraints:
                    unique: true
                    nullable: true
                    foreignKeyName: fk_users_employee
                    references: employees(id)

              - column:
                  name: username
                  type: VARCHAR(25)
                  constraints:
                    unique: true
                    nullable: false

              - column:
                  name: password_hash
                  type: VARCHAR(255)
                  constraints:
                    nullable: false

              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: created_by
                  type: VARCHAR(36)
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP

              - column:
                  name: updated_by
                  type: VARCHAR(36)

        - createIndex:
            tableName: users
            indexName: idx_users_email
            columns:
              - column:
                  name: email

        - createIndex:
            tableName: users
            indexName: idx_users_employee_id
            columns:
              - column:
                  name: employee_id