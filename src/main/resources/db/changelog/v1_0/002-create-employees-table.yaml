databaseChangeLog:
  - changeSet:
      id: 002-create-employees-tables-2026-11-24
      author: Hamid Guluzadeh
      changes:
        - createTable:
            tableName: employees
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: store_id
                  type: VARCHAR(36)
                  constraints:
                    nullable: true
                    foreignKeyName: fk_employee_store
                    references: stores(id)

              - column:
                  name: first_name
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: last_name
                  type: VARCHAR(30)
                  constraints:
                    nullable: false

              - column:
                  name: phone_number
                  type: VARCHAR(25)
                  constraints:
                    nullable: false
                    unique: true

              - column:
                  name: email
                  type: VARCHAR(50)

              - column:
                  name: role
                  type: VARCHAR(20)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(15)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: created_by
                  type: VARCHAR(36)
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP

              - column:
                  name: updated_by
                  type: VARCHAR(36)

              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false