databaseChangeLog:
  - changeSet:
      id: 001-create-staff-tables-2026-11-24
      author: Hamid Guluzadeh
      changes:
        - createTable:
            tableName: stores
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false

              - column:
                  name: code
                  type: varchar(20)
                  constraints:
                    unique: true
                    nullable: false

              - column:
                  name: name
                  type: varchar(100)
                  constraints:
                    nullable: false

              - column:
                  name: format
                  type: varchar(30)
                  constraints:
                    nullable: false

              - column:
                  name: status
                  type: VARCHAR(15)
                  constraints:
                    nullable: false

              - column:
                  name: created_at
                  type: TIMESTAMP
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false

              - column:
                  name: created_by
                  type: VARCHAR(36)
                  constraints:
                    nullable: false

              - column:
                  name: updated_at
                  type: TIMESTAMP

              - column:
                  name: updated_by
                  type: VARCHAR(36)

              - column:
                  name: version
                  type: BIGINT
                  defaultValueNumeric: 0
                  constraints:
                    nullable: false